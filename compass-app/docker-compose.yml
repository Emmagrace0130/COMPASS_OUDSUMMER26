name: compass-oudsummer26

services:
  neo4j:
    container_name: compass-neo4j
    image: neo4j:5
    ports:
      - "7480:7474"   # HTTP browser
      - "7470:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/compass4OUD
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    container_name: compass-backend
    build: ./backend
    env_file: ./backend/.env
    environment:
      - VECTOR_LIBRARY_PATH=/app/Vector_Library
      - FAISS_INDEX_PATH=/app/faiss_index
    volumes:
      - ../Vector_Library:/app/Vector_Library:ro
      - ./backend/faiss_index:/app/faiss_index
      - fastembed_cache:/root/.cache/fastembed
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped

  frontend:
    container_name: compass-frontend
    build: ./frontend
    environment:
      - VIRTUAL_HOST=compass.axiomsystemslab.com,compass.rubyrecon.com,compass.hitslab.app
      - LETSENCRYPT_HOST=compass.axiomsystemslab.com,compass.rubyrecon.com,compass.hitslab.app
      - LETSENCRYPT_EMAIL=asl@utk.edu
    networks:
      - default
      - viridian_network
    depends_on:
      - backend
      - neo4j
    restart: unless-stopped

volumes:
  fastembed_cache:
  neo4j_data:
  neo4j_logs:

networks:
  viridian_network:
    external: true
