<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-mol">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── MORPHINE · top left ── -->
  <text x="62" y="38" font-family="monospace" font-size="8.5" letter-spacing="1" fill="#d97316" opacity="0.9">MORPHINE · C₁₇H₁₉NO₃</text>
  <line x1="62" y1="43" x2="205" y2="43" stroke="#d97316" stroke-width="0.6" opacity="0.5"/>
  <!-- 3-ring system -->
  <polygon points="80,80 96,70 112,80 112,100 96,110 80,100"  fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="112,80 128,70 144,80 144,100 128,110 112,100" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="144,80 160,70 176,80 176,100 160,110 144,100" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- bridge -->
  <polyline points="96,110 96,125 128,125 128,110" fill="none" stroke="#fb923c" stroke-width="1.2"/>
  <!-- OH stub -->
  <line x1="80" y1="90" x2="64" y2="81"  stroke="#fb923c" stroke-width="1.2"/>
  <!-- N stub -->
  <line x1="176" y1="90" x2="192" y2="81" stroke="#fb923c" stroke-width="1.2"/>
  <!-- atom labels -->
  <text x="57"  y="79" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <text x="191" y="79" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">N</text>
  <!-- junction dots -->
  <circle cx="96"  cy="70" r="2.5" fill="#fb923c"/>
  <circle cx="128" cy="70" r="2.5" fill="#fb923c"/>
  <circle cx="160" cy="70" r="2.5" fill="#fb923c"/>

  <!-- ── FENTANYL · top right ── -->
  <text x="422" y="38" font-family="monospace" font-size="8.5" letter-spacing="1" fill="#d97316" opacity="0.9">FENTANYL · C₂₂H₂₈N₂O</text>
  <line x1="422" y1="43" x2="625" y2="43" stroke="#d97316" stroke-width="0.6" opacity="0.5"/>
  <!-- left phenyl -->
  <polygon points="462,60 478,52 494,60 494,78 478,86 462,78" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- piperidine -->
  <polygon points="510,60 526,52 542,60 542,78 526,86 510,78" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- right phenyl -->
  <polygon points="558,52 574,44 590,52 590,70 574,78 558,70" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- chain links -->
  <line x1="494" y1="69" x2="510" y2="69" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="542" y1="69" x2="558" y2="61" stroke="#fb923c" stroke-width="1.2"/>
  <!-- C=O pendant -->
  <line x1="542" y1="69" x2="554" y2="85" stroke="#fb923c" stroke-width="1.2"/>
  <!-- N chain down -->
  <line x1="526" y1="86" x2="526" y2="102" stroke="#fb923c" stroke-width="1.2"/>
  <!-- atom labels -->
  <text x="521" y="74"  font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">N</text>
  <text x="549" y="97"  font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <text x="521" y="114" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">N</text>
  <!-- junction dots -->
  <circle cx="478" cy="52" r="2.5" fill="#fb923c"/>
  <circle cx="574" cy="44" r="2.5" fill="#fb923c"/>
  <circle cx="526" cy="86" r="2.5" fill="#fb923c"/>

  <!-- ── NALOXONE · bottom left ── -->
  <text x="56" y="476" font-family="monospace" font-size="8.5" letter-spacing="1" fill="#d97316" opacity="0.9">NALOXONE · C₁₉H₂₁NO₄</text>
  <line x1="56" y1="459" x2="210" y2="459" stroke="#d97316" stroke-width="0.6" opacity="0.5"/>
  <!-- 3-ring system -->
  <polygon points="72,430 86,422 100,430 100,448 86,456 72,448"   fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="100,430 114,422 128,430 128,448 114,456 100,448" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="128,430 142,422 156,430 156,448 142,456 128,448" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- allyl branch -->
  <line x1="156" y1="439" x2="172" y2="430" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="172" y1="430" x2="188" y2="439" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="172" y1="430" x2="172" y2="416" stroke="#fb923c" stroke-width="1.2"/>
  <!-- OH stubs -->
  <line x1="72"  y1="439" x2="58"  y2="431" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="86"  y1="456" x2="86"  y2="470" stroke="#fb923c" stroke-width="1.2"/>
  <!-- atom labels -->
  <text x="148" y="445" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">N</text>
  <text x="50"  y="430" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <text x="80"  y="482" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <!-- junction dots -->
  <circle cx="86"  cy="422" r="2.5" fill="#fb923c"/>
  <circle cx="114" cy="422" r="2.5" fill="#fb923c"/>
  <circle cx="142" cy="422" r="2.5" fill="#fb923c"/>

  <!-- ── OXYCODONE · bottom right ── -->
  <text x="428" y="476" font-family="monospace" font-size="8.5" letter-spacing="1" fill="#d97316" opacity="0.9">OXYCODONE · C₁₈H₂₁NO₄</text>
  <line x1="428" y1="459" x2="625" y2="459" stroke="#d97316" stroke-width="0.6" opacity="0.5"/>
  <!-- 3-ring system -->
  <polygon points="450,430 464,422 478,430 478,448 464,456 450,448" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="478,430 492,422 506,430 506,448 492,456 478,448" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="506,430 520,422 534,430 534,448 520,456 506,448" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- epoxide arc -->
  <path d="M464,422 Q478,410 492,422" fill="none" stroke="#fb923c" stroke-width="1.4"/>
  <!-- N stub -->
  <line x1="534" y1="439" x2="550" y2="431" stroke="#fb923c" stroke-width="1.2"/>
  <!-- ketone -->
  <line x1="492" y1="456" x2="492" y2="470" stroke="#fb923c" stroke-width="1.2"/>
  <!-- O stub left -->
  <line x1="450" y1="439" x2="436" y2="431" stroke="#fb923c" stroke-width="1.2"/>
  <!-- atom labels -->
  <text x="474" y="410" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <text x="549" y="430" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">N</text>
  <text x="486" y="483" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <text x="426" y="430" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" filter="url(#glow-mol)">O</text>
  <!-- junction dots -->
  <circle cx="464" cy="422" r="2.5" fill="#fb923c"/>
  <circle cx="492" cy="422" r="2.5" fill="#fb923c"/>
  <circle cx="520" cy="422" r="2.5" fill="#fb923c"/>

  <!-- ── TENNESSEE label ── -->
  <text x="340" y="502" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="4" font-weight="600" fill="#d97316" opacity="0.85">TENNESSEE</text>
  <line x1="178" y1="497" x2="272" y2="497" stroke="#d97316" stroke-width="0.7" opacity="0.5"/>
  <line x1="408" y1="497" x2="502" y2="497" stroke="#d97316" stroke-width="0.7" opacity="0.5"/>
  <circle cx="274" cy="497" r="2" fill="#d97316" opacity="0.7"/>
  <circle cx="406" cy="497" r="2" fill="#d97316" opacity="0.7"/>

  <!-- Corner brackets -->
  <path d="M48 24 L48 42 L66 42"  fill="none" stroke="#d97316" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <path d="M632 24 L632 42 L614 42" fill="none" stroke="#d97316" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <path d="M48 516 L48 498 L66 498"  fill="none" stroke="#d97316" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <path d="M632 516 L632 498 L614 498" fill="none" stroke="#d97316" stroke-width="1.2" stroke-opacity="0.5" stroke-linejoin="round"/>
</svg>
