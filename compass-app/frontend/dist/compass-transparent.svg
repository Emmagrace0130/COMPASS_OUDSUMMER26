<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="needle-n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="needle-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="face-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="100%" stop-color="#13102a"/>
    </linearGradient>
  </defs>

  <!-- COMPASS ROSE -->
  <circle cx="340" cy="270" r="168" fill="none" stroke="#1a1240" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="340" cy="270" r="150" fill="none" stroke="#1e1650" stroke-width="0.8"/>
  <circle cx="340" cy="270" r="135" fill="url(#face-grad)" stroke="#4c1d95" stroke-width="1.5"/>
  <circle cx="340" cy="270" r="133" fill="none" stroke="#7c3aed" stroke-width="0.4" opacity="0.5"/>

  <!-- Cardinal ticks -->
  <line x1="340" y1="137" x2="340" y2="150" stroke="#7c3aed" stroke-width="2"/>
  <line x1="340" y1="390" x2="340" y2="403" stroke="#4c1d95" stroke-width="2"/>
  <line x1="207" y1="270" x2="220" y2="270" stroke="#4c1d95" stroke-width="2"/>
  <line x1="460" y1="270" x2="473" y2="270" stroke="#4c1d95" stroke-width="2"/>
  <line x1="435" y1="175" x2="426" y2="184" stroke="#312e81" stroke-width="1.2"/>
  <line x1="435" y1="365" x2="426" y2="356" stroke="#312e81" stroke-width="1.2"/>
  <line x1="245" y1="175" x2="254" y2="184" stroke="#312e81" stroke-width="1.2"/>
  <line x1="245" y1="365" x2="254" y2="356" stroke="#312e81" stroke-width="1.2"/>

  <!-- Direction labels -->
  <text x="340" y="133" text-anchor="middle" font-family="Orbitron, monospace" font-size="13" font-weight="700" fill="#c084fc" filter="url(#glow-purple)">N</text>
  <text x="340" y="422" text-anchor="middle" font-family="Orbitron, monospace" font-size="13" font-weight="700" fill="#4c3688">S</text>
  <text x="200" y="275" text-anchor="middle" font-family="Orbitron, monospace" font-size="13" font-weight="700" fill="#4c3688">W</text>
  <text x="480" y="275" text-anchor="middle" font-family="Orbitron, monospace" font-size="13" font-weight="700" fill="#4c3688">E</text>
  <text x="434" y="173" text-anchor="middle" font-family="Orbitron, monospace" font-size="9" fill="#312e81">NE</text>
  <text x="246" y="173" text-anchor="middle" font-family="Orbitron, monospace" font-size="9" fill="#312e81">NW</text>
  <text x="434" y="373" text-anchor="middle" font-family="Orbitron, monospace" font-size="9" fill="#312e81">SE</text>
  <text x="246" y="373" text-anchor="middle" font-family="Orbitron, monospace" font-size="9" fill="#312e81">SW</text>

  <!-- Crosshairs -->
  <line x1="340" y1="155" x2="340" y2="385" stroke="#2d1f6e" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="222" y1="270" x2="458" y2="270" stroke="#2d1f6e" stroke-width="0.5" stroke-dasharray="3 4"/>

  <!-- Needle North -->
  <polygon points="340,163 333,270 340,258 347,270" fill="url(#needle-n)" filter="url(#glow-purple)"/>
  <!-- Needle South -->
  <polygon points="340,377 333,270 340,282 347,270" fill="url(#needle-s)"/>

  <!-- Center hub -->
  <circle cx="340" cy="270" r="8" fill="#090714" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="340" cy="270" r="3" fill="#c084fc" filter="url(#glow-purple)"/>


  <!-- Rim dots -->
  <circle cx="340" cy="155" r="3" fill="#c084fc" opacity="0.8" filter="url(#glow-purple)"/>
  <circle cx="430" cy="187" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="430" cy="353" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="250" cy="187" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="250" cy="353" r="2" fill="#a78bfa" opacity="0.5"/>
</svg>
